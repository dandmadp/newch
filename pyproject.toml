[build-system]
# ziglang provides a C compiler as a pip package, so installing from source
# needs no system toolchain on any platform.
requires = ["setuptools>=77", "wheel", "ziglang>=0.11"]
build-backend = "setuptools.build_meta"

[project]
name = "newch"
version = "0.4.0"
description = "A small machine-learning library for low-spec machines: PyTorch-style autograd, Keras-style fit, portable C engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "The newch authors"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["machine learning", "deep learning", "autograd", "neural network", "embedded", "low-spec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/dandmadp/newch"
Source = "https://github.com/dandmadp/newch"
Issues = "https://github.com/dandmadp/newch/issues"
Documentation = "https://dandmadp.github.io/newch/"
Changelog = "https://dandmadp.github.io/newch/changelog/"

[project.optional-dependencies]
numpy = ["numpy"]

[tool.setuptools]
packages = ["newch", "newch.net"]
